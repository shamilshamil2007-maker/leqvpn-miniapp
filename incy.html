
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <title>LeqVPN — подключение</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f3f8ff;
      background:
        radial-gradient(ellipse at top, #123b70 0%, transparent 55%),
        linear-gradient(160deg, #071426, #0b1d35 65%, #06101f);
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 28px 22px;
      border: 1px solid #214b79;
      border-radius: 26px;
      background: rgba(10, 29, 52, .94);
      box-shadow: 0 20px 60px #02081280;
      text-align: center;
    }
    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: #72caff;
      background: linear-gradient(145deg, #164b86, #102b50);
      border: 1px solid #3474b5;
      font-size: 34px;
    }
    h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
    .subtitle { color: #83b5e7; margin-top: 7px; font-size: 14px; }
    .line { height: 1px; background: #203e60; margin: 25px 0; }
    h2 { font-size: 21px; margin: 0 0 10px; }
    .description {
      margin: 0 0 24px;
      color: #afc5de;
      font-size: 15px;
      line-height: 1.6;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 16px;
      color: white;
      background: linear-gradient(100deg, #1478e5, #299de9);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px #1478e54a;
    }
    button:active { transform: scale(.98); }
    #status { color: #ffbd8a; font-size: 13px; line-height: 1.5; }
    footer { color: #7194b9; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🛡</div>
    <h1>LeqVPN</h1>
    <div class="subtitle">Твоё подключение. Твои правила.</div>
    <div class="line"></div>
    <h2>VPN готов к импорту</h2>
    <p class="description">
      Добавь подписку LeqVPN в INCY одним нажатием
      и подключись к своим VPN-серверам.
    </p>
    <button id="open">↗ Открыть в INCY</button>
    <p id="status"></p>
    <footer>LeqVPN · Безопасное подключение</footer>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const subscription = params.get("url");
    document.getElementById("open").onclick = () => {
      if (!subscription || !subscription.startsWith("https://")) {
        document.getElementById("status").textContent =
          "Ссылка подписки отсутствует. Вернись в Telegram и запроси импорт заново.";
        return;
      }
      location.href = "incy://add/" + encodeURIComponent(subscription);
    };
  </script>
</body>
</html>
