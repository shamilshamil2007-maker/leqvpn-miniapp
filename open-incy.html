
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeqVPN — INCY</title>
<style>
body{font-family:Arial,sans-serif;background:#071426;color:white;text-align:center;padding:48px 20px}
a{display:inline-block;background:#168cff;color:white;padding:16px 24px;border-radius:12px;text-decoration:none;font-weight:bold}
p{color:#b8c9dc;line-height:1.6}
</style>
</head>
<body>
<h2>LeqVPN</h2>
<p id="note">Подготовка импорта подписки в INCY.</p>
<a id="open" href="#" hidden>🚀 Импортировать в INCY</a>
<script>
const params = new URLSearchParams(location.search);
const subscription = params.get("url");
if (subscription && subscription.startsWith("https://")) {
  document.getElementById("open").href =
    "incy://add?url=" + encodeURIComponent(subscription);
  document.getElementById("open").hidden = false;
  document.getElementById("note").textContent =
    "Нажми кнопку, чтобы передать подписку в INCY.";
} else {
  document.getElementById("note").textContent =
    "Ссылка не передана. Вернись в Telegram.";
}
</script>
</body>
</html>
